name: Jarvis BTC-setups

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: jarvis
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Geheugen ophalen
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: jarvis-state-${{ github.run_id }}
          restore-keys: jarvis-state-

      - name: Markt scannen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JARVIS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          JARVIS_RISK_USD: "20"
          JARVIS_TIMEFRAMES: "5m,15m"
        run: python3 jarvis_bot.py

      - name: Geheugen bewaren
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: jarvis-state-${{ github.run_id }}
